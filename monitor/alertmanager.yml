global:
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alert@rocgit.com'
  smtp_auth_username: 'alert@rocgit.com'
  smtp_auth_password: 'CHANGE_ME'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    email_configs:
      - to: 'dev@rocgit.com'
        send_resolved: true
    webhook_configs:
      - url: 'http://127.0.0.1:9090/-/reload'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
