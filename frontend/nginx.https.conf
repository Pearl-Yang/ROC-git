# ROC-git 前端 nginx 生产配置（HTTPS + WAF + 限流）
# 部署前：
#   1. 申请 ICP 备案域名
#   2. 申请 Let's Encrypt 证书（或上传自有证书到 /etc/nginx/certs/）
#       certbot certonly --webroot -w /var/www/certbot -d your-domain.com
#   3. 把本文件作为 /etc/nginx/conf.d/default.conf 加载

# 强制 HTTPS + HSTS
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 250M;

    # 静态资源
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 限流：单 IP 每分钟 60 次请求（防爬虫 / 暴力破解）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    # T-01：后端 API 反代
    location /api/ {
        limit_req zone=api_limit burst=120 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 登录接口独立限流（更严格）
    location ~ ^/api/v1/(user/login|sms/) {
        limit_req zone=login_limit burst=20 nodelay;
        proxy_pass http://backend:8080;
    }

    # T-01：上传文件静态服务（共享卷 /data/files 在 frontend 容器里挂为 ro）
    location /files/ {
        alias /data/files/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # uni-app H5 单页 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 缓存静态资源
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
